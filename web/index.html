<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>词签</title><link rel="stylesheet" href="styles.css"></head><body><main class="app"><header hidden><h1 id="title"></h1></header>
<section id="printPage" class="page" role="tabpanel" aria-labelledby="printTab"><div class="language-switch" aria-label="翻译方向"><span id="sourceLanguage">中文</span><button id="swapLanguages" class="icon-button" aria-label="切换为英译中"><span aria-hidden="true">⇄</span></button><span id="targetLanguage">英语</span></div><div class="input-block"><div class="input-head"><label id="sourceTitle" for="chinese">中文</label><span id="sourceActions" class="field-actions"></span><button id="clear" class="speak">清空</button></div><div class="entry"><textarea id="chinese" placeholder="想把什么贴成英文？" maxlength="60" enterkeyhint="done">早上好</textarea><output id="sourceIpa" hidden aria-label="音标"></output></div></div>
<div class="result"><div id="resultHeading" class="eyebrow"><span id="resultTitle">英文与音标</span><button id="speak" class="icon-button" aria-label="朗读英文" aria-pressed="false" disabled><i class="icon icon-volume" aria-hidden="true"></i></button></div><div id="translationOptions" class="translation-options" role="radiogroup" aria-label="选择英文译法" hidden></div><div id="singleTranslation" class="translation-card"><output id="translationPending" aria-live="polite" hidden>翻译中…</output><input id="word" readonly tabindex="-1" aria-label="英文" placeholder="等待翻译" autocapitalize="none" spellcheck="false"><div class="pronunciation"><input id="ipa" readonly tabindex="-1" aria-label="音标" placeholder="" autocapitalize="none" spellcheck="false"></div></div><div id="chineseResult" class="translation-card" hidden><output id="meaning" aria-live="polite"></output></div></div><p class="flow-status" id="status" role="status" aria-live="polite"></p><div class="bottom-actions"><p class="note print-layout-hint">第一行打印英文，第二行打印音标</p><button id="printAgain" class="primary" disabled>打印</button><button id="translatePrint" class="secondary" hidden>重试翻译</button></div></section>
<section id="settingsPage" class="page settings" role="tabpanel" aria-labelledby="settingsTab" hidden><div class="settings-switch" role="tablist" aria-label="设置分类"><button id="labelSettingsTab" role="tab" aria-selected="true" aria-controls="labelSettings">标签</button><button id="modelSettingsTab" role="tab" aria-selected="false" aria-controls="modelSettings">大模型</button></div><div id="labelSettings" class="settings-pane" role="tabpanel" aria-labelledby="labelSettingsTab"><div class="group"><div class="row device"><div>德佟 P0<br><span id="deviceState">未连接</span></div><button id="connect" class="speak">连接</button></div></div><div class="stage"><canvas id="canvas" width="960" height="384" aria-label="标签预览"></canvas></div>
<div class="group"><div class="row"><label for="sampleWord">英文</label><input id="sampleWord" class="compact-input" value="hello" autocapitalize="none" spellcheck="false"></div><div class="row"><label for="sampleIpa">音标</label><button id="speakSample" class="icon-button" type="button" aria-label="朗读预览英文" aria-pressed="false"><i class="icon icon-volume" aria-hidden="true"></i></button><input id="sampleIpa" class="compact-input" value="/həˈləʊ/" autocapitalize="none" spellcheck="false"></div></div>
<div class="group"><div class="row"><label for="width">宽度</label><input id="width" class="dimension-input" type="number" min="10" max="100" step="0.5" value="30"><span class="unit">mm</span></div><div class="row"><label for="height">高度</label><input id="height" class="dimension-input" type="number" min="6" max="12" step="0.5" value="12"><span class="unit">mm</span></div></div><div class="group"><div class="row"><label for="font">字号</label><input id="font" type="range" min="6" max="12" step="0.5" value="10"><output id="fontValue">10 pt</output></div></div>
<div class="group"><div class="row"><label>边距</label><span class="unit">mm</span></div><div class="margins"><div class="margin"><label for="top">上</label><input id="top" type="number" min="0" max="4" step="0.5" value="2"></div><div class="margin"><label for="bottom">下</label><input id="bottom" type="number" min="0" max="4" step="0.5" value="2"></div><div class="margin"><label for="left">左</label><input id="left" type="number" min="0" max="5" step="0.5" value="1"></div><div class="margin"><label for="right">右</label><input id="right" type="number" min="0" max="5" step="0.5" value="1"></div></div></div>
<p class="fixed">90° 出纸 · 不干胶 · 间隔 3 mm<br>偏移 0 · 浓度和速度使用设备默认 · 上下居中</p><p id="settingsError" class="settings-error" role="alert"></p></div>
<form id="modelSettings" class="settings-pane" role="tabpanel" aria-labelledby="modelSettingsTab" hidden autocomplete="off">

<div class="group"><div class="config-field"><label for="apiUrl">API URL</label><input id="apiUrl" type="url" placeholder="https://api.anthropic.com" spellcheck="false" autocapitalize="none" required></div><div class="config-field"><label for="apiKey">API Key</label><input id="apiKey" type="password" placeholder="输入 API Key" autocomplete="new-password" spellcheck="false" autocapitalize="none"></div><div class="config-field"><label for="modelName">模型</label><input id="modelName" placeholder="输入模型 ID" spellcheck="false" autocapitalize="none" required maxlength="200"></div><div id="effortField" class="config-field" hidden><fieldset id="modelEffort"><legend>思考强度</legend><div class="effort-options"><label><input type="radio" name="modelEffort" value="low" checked><span>low</span></label><label><input type="radio" name="modelEffort" value="high"><span>high</span></label><label><input type="radio" name="modelEffort" value="max"><span>max</span></label></div></fieldset></div></div>
<p id="configError" class="note error" role="alert" hidden></p><div class="config-actions"><button id="saveConfig" class="primary" type="submit">保存</button></div>
</form></section>
<section id="chatPage" class="page chat-page" role="tabpanel" aria-labelledby="chatTab" hidden>
<div class="chat-heading"><button id="chatBack" class="icon-button" aria-label="返回"><i class="icon icon-back" aria-hidden="true"></i></button><h2 class="section-title">AI 助手</h2><button id="newChat" class="icon-button" aria-label="新对话" disabled><i class="icon icon-new-chat" aria-hidden="true"></i></button><button id="chatHistory" class="icon-button" aria-label="历史对话"><i class="icon icon-history" aria-hidden="true"></i></button></div>
<div id="messages" class="messages" role="log" aria-label="聊天记录" aria-live="polite"><div id="chatEmpty" class="chat-empty"><i class="icon icon-ai" aria-hidden="true"></i><button id="configureModel" class="speak">配置大模型</button></div></div>
<div id="chatFeedback" class="chat-feedback" hidden><p id="chatError" class="note error" role="alert"></p><button id="retryChat" class="speak" hidden>重试</button></div>
<form id="chatForm" class="composer">
<div id="photoPreview" class="photo-preview" hidden><img id="photoThumb" alt="待发送照片"><button id="removePhoto" class="icon-button" type="button" aria-label="移除照片"><i class="icon icon-close" aria-hidden="true"></i></button></div>
<div class="composer-row"><button id="voiceToggle" class="icon-button" type="button" aria-label="切换语音输入" aria-pressed="false"><i class="icon icon-microphone" aria-hidden="true"></i></button><textarea id="chatInput" aria-label="消息" placeholder="输入消息" rows="1" maxlength="16000" enterkeyhint="send"></textarea><button id="holdToTalk" class="hold-to-talk" type="button" hidden>按住说话</button><button id="choosePhoto" class="icon-button" type="button" aria-label="选择照片"><i class="icon icon-camera" aria-hidden="true"></i></button><button id="sendChat" type="submit" class="icon-button send-button" aria-label="发送" disabled><i class="icon icon-send" aria-hidden="true"></i></button></div>
<input id="chatPhoto" type="file" accept="image/*" hidden>
</form>
<dialog id="historyDialog" class="history-dialog" aria-labelledby="historyTitle"><div class="chat-heading"><h2 id="historyTitle" class="section-title">历史对话</h2><button id="closeHistory" class="icon-button" aria-label="关闭历史对话"><i class="icon icon-close" aria-hidden="true"></i></button></div><div id="historyList" class="history-list"></div></dialog>
</section>
<nav class="tabs" role="tablist" aria-label="主导航"><button id="printTab" role="tab" aria-selected="true" aria-controls="printPage"><i class="icon icon-print" aria-hidden="true"></i>打印</button><button id="chatTab" class="ai-tab" role="tab" aria-label="AI 助手" aria-selected="false" aria-controls="chatPage"><span class="ai-circle"><i class="icon icon-ai" aria-hidden="true"></i></span></button><button id="settingsTab" role="tab" aria-selected="false" aria-controls="settingsPage"><i class="icon icon-settings" aria-hidden="true"></i>设置</button></nav>
</main>
<script src="diagnostic-schema.js"></script><script src="diagnostics.js"></script><script src="interactions.js"></script><script src="phonetics.js"></script><script src="translation-options.js"></script><script src="pronunciation-audio.js"></script><script src="app.js"></script><script src="vendor/marked.umd.js"></script><script src="vendor/purify.min.js"></script><script src="markdown.js"></script><script src="sse.js"></script><script src="chat-input.js"></script><script src="agent-protocol.js"></script><script src="print-cards.js"></script><script src="option-parts.js"></script><script src="choice-cards.js"></script><script src="chat-store.js"></script><script src="assistant.js"></script></body></html>
